name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest pyflakes
      - name: Check no em dashes
        run: python scripts/check_no_em_dash.py
      - name: Lint
        run: python -m pyflakes data tests scripts
      - name: Generate data
        run: python data/generate.py
      - name: Run tests
        run: python -m pytest
